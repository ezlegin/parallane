services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: parallane-app:latest
    container_name: parallane-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: https://parallane.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: https://parallane.com
      LETSENCRYPT_EMAIL: info@parallane.com
    expose:
      - "3000"
    networks:
      - default
      - app_network

  db:
    image: postgres:16-alpine
    container_name: parallane-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # map generic .env vars to what the postgres image expects
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - parallane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default

volumes:
  parallane-db-data:

networks:
  default:
    name: parallane-net
  app_network:
    external: true
    name: app_network
